[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform-mcp"
version = "0.2.0"
description = "Read-only BigQuery MCP server for asking data questions in plain language"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dimuthu Bhathiya" }]
keywords = ["mcp", "model-context-protocol", "bigquery", "gcp", "google-cloud", "sql", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "google-cloud-bigquery>=3.25.0",
    # Scheduled queries live in the Data Transfer Service, a separate API.
    "google-cloud-bigquery-datatransfer>=3.15.0",
    "google-auth>=2.28.0",
]

[project.urls]
# The distribution is data-platform-mcp because bigquery-mcp is taken on PyPI
# by an unrelated project; the repository keeps its original name.
Homepage = "https://github.com/deBilla/bigquery-mcp"
Repository = "https://github.com/deBilla/bigquery-mcp"
Issues = "https://github.com/deBilla/bigquery-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
data-platform-mcp = "data_platform_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# The one-time setup script ships inside the package so `data-platform-mcp
# setup` works from a plain `uvx data-platform-mcp`, with no checkout to clone.
[tool.setuptools.package-data]
data_platform_mcp = ["scripts/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
